# ─────────────────────────────────────────────────────────────
# Intégration continue : lance les tests automatiquement
# à chaque push sur main et à chaque Pull Request.
# ─────────────────────────────────────────────────────────────
name: Tests

on:
    push:
        branches: [main]
    pull_request:

# Principe du moindre privilège : le workflow peut seulement LIRE le dépôt.
permissions:
    contents: read

jobs:
    tests:
        # Nom affiché dans GitHub, par exemple « Python 3.14 · windows-latest »
        name: Python ${{ matrix.python-version }} · ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        # Garde-fou : un scan de test bloqué ne doit pas consommer 6 h de minutes CI
        timeout-minutes: 10

        strategy:
            # Si une combinaison échoue, les autres continuent : on voit tout d'un coup
            fail-fast: false
            matrix:
                # Windows est indispensable : asyncio y utilise une boucle d'événements différente (Proactor)
                os: [ubuntu-latest, windows-latest]
                python-version: ["3.11", "3.14"] # version minimale déclarée + version actuelle

        steps:
            - name: Récupérer le code
              uses: actions/checkout@v7
              with:
                  # Le jeton d'accès n'est pas conservé après la récupération du code
                  persist-credentials: false

            - name: Installer Python ${{ matrix.python-version }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Installer le projet et les dépendances de test
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            # -X dev : mode développement de Python (débogage asyncio, ResourceWarning visibles) ;
            # avec filterwarnings = ["error"], un socket oublié ouvert fait échouer la CI.
            - name: Lancer les tests
              run: python -X dev -m pytest -v

            - name: Vérifier que la commande est bien installée
              run: port-scanner --version

    # ─── Qualité et sécurité du code ──────────────────────────
    quality:
        name: Qualité · ruff
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Récupérer le code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Installer Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.14"

            - name: Installer les outils
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            # Règles de style, de logique et de sécurité (S = règles issues de Bandit)
            - name: Analyse statique
              run: ruff check --output-format github .

            - name: Formatage
              run: ruff format --check .

    # ─── Volet détection : les règles fonctionnent-elles vraiment ? ──
    detection:
        name: Détection · Suricata + Sigma
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Récupérer le code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Installer Suricata
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq suricata
                  suricata -V

            # Rejoue les captures d'exemple : le scan doit être détecté, le trafic normal ignoré
            - name: Vérifier les règles Suricata
              run: bash detection/scripts/check_suricata.sh

            - name: Installer Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.14"

            # Version épinglée : la validation reste reproductible
            - name: Installer sigma-cli
              run: pip install "sigma-cli==4.0.0"

            - name: Valider la règle Sigma
              run: sigma check detection/sigma/
